# Pins the hooks to the .nvmrc Node before anything runs.
rc: .lefthookrc

# npx: `--no` never fetches; `--package` names the package, so a cached look-alike never runs.
pre-commit:
  parallel: true
  commands:
    # Lint and auto-fix staged files with Biome.
    lint-staged:
      run: NO_COLOR=1 npx --no --no-progress -- @biomejs/biome check --no-errors-on-unmatched --files-ignore-unknown=true --write {staged_files}
      stage_fixed: true
    # Typecheck the project. astro check covers .astro and .ts together.
    typecheck:
      glob: "*.{ts,tsx,astro}"
      run: NO_COLOR=1 npx --no --no-progress --package=astro -- astro check

# Rejects a commit message that is not Conventional Commits. Rules live in
# commitlint.config.mjs; the reasoning lives in the conventional-commits skill.
# `{1}` is the message file path git passes to the hook.
commit-msg:
  commands:
    lint-message:
      run: NO_COLOR=1 npx --no --no-progress --package=@commitlint/cli -- commitlint --edit {1}
